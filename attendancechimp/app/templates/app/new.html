<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - AttendanceChimp</title>
</head>
<body style="text-align:center; font-family:Arial, sans-serif;">
<h1>Sign Up</h1>
<form method="post" action="/app/createUser">
    {% csrf_token %}
    <p>User name: <input type="text" name="user_name"></p>
    <p>Email: <input type="email" name="email"></p>
    <p>Password: <input type="password" name="password"></p>
    <p>
        <input type="radio" name="is_student" value="1" checked> Student
        <input type="radio" name="is_student" value="0"> Instructor
    </p>
    <p><input type="submit" value="Sign Up"></p>
</form>
</body>
</html>
